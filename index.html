<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Resume Cinema — Mobile AR + WebXR</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #000;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      touch-action: none;
    }

    #webgl-canvas {
      position: fixed; inset: 0;
      width: 100%; height: 100%;
      display: block;
      z-index: 1;
      cursor: grab;
    }
    #webgl-canvas.dragging { cursor: grabbing; }

    #css3d-root {
      position: fixed; inset: 0;
      pointer-events: none;
      z-index: 2;
    }

    body.vr-mode #css3d-root,
    body.vr-mode #pdf-link,
    body.vr-mode #ar-button { display: none; }

    /* === PROJECTOR SCREEN === */
    #screen-wrapper {
      background: #0b0b0d;
      border: 10px solid #1c1c1f;
      border-radius: 8px;
      overflow: hidden;
      box-shadow:
        0 0 0 2px #2a2a2e,
        0 30px 80px rgba(0, 0, 0, 0.9),
        0 0 120px rgba(80, 120, 255, 0.06);
      pointer-events: none;
    }

    #screen-scroll {
      width: 100%; height: 100%;
      overflow-y: auto;
      overflow-x: hidden;
      pointer-events: auto;
      color: #e8e8ec;
      font-size: clamp(14px, 1.4vw, 20px);
      line-height: 1.55;
      padding: 40px 44px;
      -webkit-overflow-scrolling: touch;
    }
    #screen-scroll::-webkit-scrollbar { width: 8px; }
    #screen-scroll::-webkit-scrollbar-track { background: #141417; }
    #screen-scroll::-webkit-scrollbar-thumb { background: #3a3a40; border-radius: 4px; }
    #screen-scroll h1 { font-size: 2em; margin-bottom: 6px; color: #fff; letter-spacing: -0.01em; }
    #screen-scroll h2 { font-size: 1.3em; margin: 28px 0 10px; color: #b9c4ff; }
    #screen-scroll p  { margin-bottom: 14px; color: #c8c8cf; }
    #screen-scroll ul { margin-left: 22px; margin-bottom: 16px; color: #c8c8cf; }
    #screen-scroll li { margin-bottom: 6px; }
    #screen-scroll .kicker {
      font-size: 0.75em; letter-spacing: 0.12em; text-transform: uppercase;
      color: #ff9d5c; margin-bottom: 14px; font-weight: 700;
    }
    #screen-scroll .meta { color: #777; font-size: 0.85em; margin-top: 28px; }

    /* === CARTRIDGES === */
    .cartridge {
      width: 180px;
      height: 225px;
      pointer-events: auto;
      border: 3px solid rgba(255,255,255,0.55);
      border-radius: 6px;
      color: #fff;
      cursor: pointer;
      padding: 14px 16px;
      text-align: left;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 8px 24px rgba(0,0,0,0.7);
      transition: box-shadow 0.18s ease, border-color 0.18s ease;
      font-family: inherit;
      background: #333;
    }
    .cartridge .label {
      font-size: 11px; opacity: 0.75;
      text-transform: uppercase; letter-spacing: 1px;
    }
    .cartridge .title {
      font-size: 17px; font-weight: 700; line-height: 1.2;
    }
    .cartridge:hover {
      border-color: #fff;
      box-shadow:
        0 0 0 2px rgba(255,255,255,0.35),
        0 14px 34px rgba(0,0,0,0.9);
    }
    .cartridge.active {
      border-color: #ffb87a;
      box-shadow:
        0 0 0 3px rgba(255, 184, 122, 0.5),
        0 14px 34px rgba(0,0,0,0.9);
    }

    /* === CHROME === */
    #pdf-link {
      position: fixed;
      top: 16px; left: 16px;
      z-index: 20;
      color: #aaa; font-size: 13px;
      text-decoration: none;
      padding: 8px 12px;
      border: 1px solid #333;
      border-radius: 6px;
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(6px);
      transition: color 0.15s, border-color 0.15s;
    }
    #pdf-link:hover { color: #fff; border-color: #666; }

    #loading {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: #000; color: #666;
      font-size: 13px; letter-spacing: 0.15em; text-transform: uppercase;
      z-index: 100;
      transition: opacity 0.6s;
    }

    #ar-button {
      position: fixed;
      bottom: 16px; left: 16px;
      z-index: 20;
      background: #1c1c1f;
      color: #ddd;
      border: 1px solid #333;
      padding: 10px 16px;
      border-radius: 6px;
      font: inherit;
      font-size: 13px;
      cursor: pointer;
      transition: color 0.15s, border-color 0.15s;
    }
    #ar-button:hover { color: #fff; border-color: #666; }
    #ar-button:disabled { opacity: 0.5; cursor: not-allowed; }
  </style>
</head>
<body>
  <canvas id="webgl-canvas"></canvas>
  <div id="css3d-root"></div>

  <a id="pdf-link" href="/resume.pdf" target="_blank" rel="noopener">↓ Plain PDF resume</a>
  <button id="ar-button">Step Into Cinema</button>

  <div id="loading">Loading cinema…</div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
        "html2canvas": "https://unpkg.com/html2canvas@1.4.1/dist/html2canvas.esm.js"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { CSS3DRenderer, CSS3DObject } from 'three/addons/renderers/CSS3DRenderer.js';
    import html2canvas from 'html2canvas';

    // =========================================================
    // CONTENT
    // =========================================================
    const CONTENT = {
      rendering: `<div class="kicker">Lens 01 · Rendering &amp; Throughput</div>
        <h1>Senior Render Wrangler</h1>
        <p>The role behind the role: how I've kept render farms alive, shots flowing, and deadlines honest across a decade of production.</p>
        <h2>Through-line</h2>
        <p><strong>2018 · Studio A.</strong> My title was Production Engineer, but the work was render wrangling — overnight farm triage, shot prioritization, and emergency troubleshooting for 40+ artists.</p>
        <p><strong>2020–2022 · Studio B.</strong> I owned the submission pipeline. Average shot turnaround dropped 34%, and the nightly render queue never missed a delivery window for two consecutive seasons.</p>
        <h2>What I actually built</h2>
        <ul>
          <li>Automated overnight farm triage — reduced artist morning triage from 90 minutes to 15.</li>
          <li>Shot prioritization system that surfaced blocking renders before artists knew they were blocked.</li>
          <li>Cloud burst rendering pipeline that scaled to 2,000 nodes during crunch.</li>
        </ul>
        <h2>Tools</h2><p>Deadline · OpenCue · AWS · Python · Prometheus · Grafana</p>`,
      pipeline: `<div class="kicker">Lens 02 · Pipeline &amp; Tooling</div>
        <h1>Pipeline Engineer</h1>
        <p>The connective tissue between departments: the tools, naming conventions, and automation that let artists do their work.</p>
        <h2>Through-line</h2>
        <p>Every role I've held, I ended up building the tool the department didn't know it needed. Asset QC at Studio C. Naming and versioning overhaul at Studio D. Render submission at Studio A.</p>
        <h2>What I actually built</h2>
        <ul>
          <li>Naming and versioning overhaul that eliminated 90% of asset mis-delivery incidents.</li>
          <li>Asset QC automation that flagged 1,200 issues across three shows before they reached lighting.</li>
          <li>Render submission tool adopted by 4 departments and 80+ artists.</li>
        </ul>
        <h2>Tools</h2><p>Python · Maya · Nuke · ShotGrid · Docker · Kubernetes</p>`,
      lookdev: `<div class="kicker">Lens 03 · Look &amp; Lighting</div>
        <h1>Look Development</h1>
        <p>The role that's hardest to see in a resume: the people who make the render actually look like the concept.</p>
        <h2>Through-line</h2>
        <p>Look dev is often uncredited, but it shows up in every frame. My contributions at Studio B and Studio D set the shader library and lighting rig that became each show's visual baseline.</p>
        <h2>What I actually built</h2>
        <ul>
          <li>Shader library used across 3 shows and 200+ assets.</li>
          <li>Lighting rigs adopted by two lighting teams as the default starting point.</li>
          <li>Color pipeline that eliminated the "why does the render look different from the comp" problem.</li>
        </ul>
        <h2>Tools</h2><p>Arnold · Katana · Houdini · Nuke · OpenColorIO</p>`,
    };

    // =========================================================
    // THREE SETUP
    // =========================================================
    const canvas = document.getElementById('webgl-canvas');
    const css3dRoot = document.getElementById('css3d-root');

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, 1, 0.1, 1000);
    camera.position.set(0, 0, 5);
    camera.lookAt(0, 0, 0);

    const webglRenderer = new THREE.WebGLRenderer({
      canvas, antialias: true, alpha: false,
    });
    webglRenderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    webglRenderer.xr.enabled = true;

    // AR requires the WebGL context to be XR-compatible.
    // Three.js handles this automatically when renderer.xr.enabled = true,
    // but the canvas itself must be created with xrCompatible if using raw WebGL.
    // Using Three.js's WebGLRenderer with xr.enabled = true is sufficient.

    const css3dRenderer = new CSS3DRenderer();
    css3dRenderer.domElement.style.position = 'absolute';
    css3dRenderer.domElement.style.top = '0';
    css3dRenderer.domElement.style.left = '0';
    css3dRenderer.domElement.style.pointerEvents = 'none';
    css3dRoot.appendChild(css3dRenderer.domElement);

    // =========================================================
    // 360 PANORAMA
    // =========================================================
    // ▼▼▼ DROP YOUR BLENDER RENDERS HERE ▼▼▼
    // const panoTextureLandscape = new THREE.TextureLoader().load('/panos/theater-landscape.jpg');
    // const panoTexturePortrait  = new THREE.TextureLoader().load('/panos/theater-portrait.jpg');
    // panoTextureLandscape.colorSpace = THREE.SRGBColorSpace;
    // panoTexturePortrait.colorSpace  = THREE.SRGBColorSpace;
    // panoMaterial.map = panoTextureLandscape;
    // panoMaterial.color.set(0xffffff);
    // panoMaterial.needsUpdate = true;
    // ▲▲▲ END PANORAMA DROP ZONE ▲▲▲

    const panoMaterial = new THREE.MeshBasicMaterial({ color: 0x0a0a0d, side: THREE.BackSide });
    const pano = new THREE.Mesh(new THREE.SphereGeometry(50, 64, 40), panoMaterial);
    scene.add(pano);

    // =========================================================
    // PROJECTOR SCREEN (CSS3D)
    // =========================================================
    const screenWrapper = document.createElement('div');
    screenWrapper.id = 'screen-wrapper';
    const screenScroll = document.createElement('div');
    screenScroll.id = 'screen-scroll';
    screenWrapper.appendChild(screenScroll);

    const screenObject = new CSS3DObject(screenWrapper);
    scene.add(screenObject);

    // =========================================================
    // CARTRIDGES (CSS3D objects)
    // =========================================================
    const CARTRIDGE_DEFS = [
      { id: 'rendering', label: 'Cartridge 01', title: 'Senior Render Wrangler',
        bg: 'linear-gradient(145deg,#7a1f17,#c0392b)' },
      { id: 'pipeline',  label: 'Cartridge 02', title: 'Pipeline Engineer',
        bg: 'linear-gradient(145deg,#1e5c36,#27ae60)' },
      { id: 'lookdev',   label: 'Cartridge 03', title: 'Look Development',
        bg: 'linear-gradient(145deg,#1a487a,#2980b9)' },
    ];

    const cartridgeObjects = [];

    CARTRIDGE_DEFS.forEach(({ id, label, title, bg }) => {
      const btn = document.createElement('button');
      btn.className = 'cartridge';
      btn.dataset.id = id;
      btn.style.background = bg;
      btn.innerHTML = `<span class="label">${label}</span><span class="title">${title}</span>`;
      btn.addEventListener('click', () => selectCartridge(id));

      const obj = new CSS3DObject(btn);
      scene.add(obj);
      cartridgeObjects.push({ id, el: btn, obj });
    });

    // =========================================================
    // XR SCREEN (WebGL plane for AR mode)
    // =========================================================
    const xrScreenCanvas = document.createElement('canvas');
    xrScreenCanvas.width = 1280;
    xrScreenCanvas.height = 720;
    const xrScreenTexture = new THREE.CanvasTexture(xrScreenCanvas);
    xrScreenTexture.colorSpace = THREE.SRGBColorSpace;
    const xrScreenMaterial = new THREE.MeshBasicMaterial({
      map: xrScreenTexture, side: THREE.DoubleSide,
    });
    const xrScreenMesh = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), xrScreenMaterial);
    xrScreenMesh.visible = false;
    scene.add(xrScreenMesh);

    // =========================================================
    // HEAD-LOOK STATE (flat mode / fallback)
    // =========================================================
    let yaw = 0, pitch = 0, targetYaw = 0, targetPitch = 0;
    const YAW_LIMIT   = THREE.MathUtils.degToRad(70);
    const PITCH_LIMIT = THREE.MathUtils.degToRad(25);

    let dragging = false, lastX = 0, lastY = 0;
    const DRAG_SENSITIVITY = 0.0035;

    canvas.addEventListener('pointerdown', (e) => {
      if (isInXR()) return;
      dragging = true;
      lastX = e.clientX;
      lastY = e.clientY;
      canvas.classList.add('dragging');
      canvas.setPointerCapture(e.pointerId);
    });
    canvas.addEventListener('pointermove', (e) => {
      if (!dragging || isInXR()) return;
      const dx = e.clientX - lastX;
      const dy = e.clientY - lastY;
      lastX = e.clientX;
      lastY = e.clientY;
      targetYaw   = THREE.MathUtils.clamp(targetYaw   - dx * DRAG_SENSITIVITY, -YAW_LIMIT, YAW_LIMIT);
      targetPitch = THREE.MathUtils.clamp(targetPitch - dy * DRAG_SENSITIVITY, -PITCH_LIMIT, PITCH_LIMIT);
    });
    const endDrag = (e) => {
      dragging = false;
      canvas.classList.remove('dragging');
      if (e.pointerId !== undefined && canvas.hasPointerCapture(e.pointerId)) {
        canvas.releasePointerCapture(e.pointerId);
      }
    };
    canvas.addEventListener('pointerup', endDrag);
    canvas.addEventListener('pointercancel', endDrag);

    function faceScreen() {
      const dir = new THREE.Vector3()
        .subVectors(screenObject.position, camera.position)
        .setY(0)
        .normalize();
      targetYaw   = THREE.MathUtils.clamp(Math.atan2(-dir.x, -dir.z), -YAW_LIMIT, YAW_LIMIT);
      targetPitch = 0;
    }

    // =========================================================
    // LAYOUT
    // =========================================================
    let currentOrientation = 'landscape';
    let currentCartridge = 'rendering';

    function positionCartridges(visibleW, visibleH, screenWorldW, screenWorldH, orientation) {
      const cssScale = visibleW / window.innerWidth;
      const cartWorldW = 180 * cssScale;
      const cartWorldH = 225 * cssScale;
      const screenRightEdge = screenObject.position.x + screenWorldW / 2;
      const gapBetweenCarts = 0.10;
      const gapFromScreen    = 0.15;

      if (orientation === 'landscape') {
        const startX = screenRightEdge + gapFromScreen + cartWorldW / 2;
        cartridgeObjects.forEach((c, i) => {
          c.obj.scale.set(cssScale, cssScale, 1);
          c.obj.position.set(
            startX + i * (cartWorldW + gapBetweenCarts),
            screenObject.position.y,
            0
          );
        });
      } else {
        const totalHeight =
          cartridgeObjects.length * cartWorldH +
          (cartridgeObjects.length - 1) * gapBetweenCarts;
        const startY = screenObject.position.y + totalHeight / 2 - cartWorldH / 2;
        cartridgeObjects.forEach((c, i) => {
          c.obj.scale.set(cssScale, cssScale, 1);
          c.obj.position.set(
            screenRightEdge + gapFromScreen + cartWorldW / 2,
            startY - i * (cartWorldH + gapBetweenCarts),
            0
          );
        });
      }
    }

    function updateLayout() {
      if (isInXR()) return;

      const w = window.innerWidth;
      const h = window.innerHeight;
      const aspect = w / h;
      const orientation = h >= w ? 'portrait' : 'landscape';

      webglRenderer.setSize(w, h);
      css3dRenderer.setSize(w, h);
      camera.aspect = aspect;
      camera.updateProjectionMatrix();

      const distance = 5;
      const fovRad = (camera.fov * Math.PI) / 180;
      const visibleH = 2 * Math.tan(fovRad / 2) * distance;
      const visibleW = visibleH * aspect;

      const SCREEN_FRACTION = 0.6;
      const screenWorldW = visibleW * SCREEN_FRACTION;
      const screenWorldH = visibleH * SCREEN_FRACTION;

      const wrapperWpx = Math.round(w * SCREEN_FRACTION);
      const wrapperHpx = Math.round(h * SCREEN_FRACTION);
      screenWrapper.style.width  = wrapperWpx + 'px';
      screenWrapper.style.height = wrapperHpx + 'px';

      screenObject.scale.set(screenWorldW / wrapperWpx, screenWorldH / wrapperHpx, 1);

      if (orientation === 'landscape') {
        screenObject.position.set(-visibleW * 0.12, 0, 0);
      } else {
        screenObject.position.set(-visibleW * 0.10, visibleH * 0.05, 0);
      }

      xrScreenMesh.scale.set(screenWorldW, screenWorldH, 1);
      xrScreenMesh.position.copy(screenObject.position);
      xrScreenMesh.quaternion.copy(screenObject.quaternion);

      positionCartridges(visibleW, visibleH, screenWorldW, screenWorldH, orientation);

      if (orientation !== currentOrientation) {
        currentOrientation = orientation;
        // ▼▼▼ Uncomment when you have real panorama textures ▼▼▼
        // panoMaterial.map = orientation === 'portrait'
        //   ? panoTexturePortrait
        //   : panoTextureLandscape;
        // panoMaterial.color.set(0xffffff);
        // panoMaterial.needsUpdate = true;
        // ▲▲▲
      }
    }

    // =========================================================
    // CARTRIDGE INTERACTION
    // =========================================================
    function selectCartridge(id) {
      currentCartridge = id;
      screenScroll.innerHTML = CONTENT[id] || '';
      screenScroll.scrollTop = 0;
      cartridgeObjects.forEach(c => {
        c.el.classList.toggle('active', c.id === id);
      });
      faceScreen();
      if (isInXR()) snapshotToXrScreen();
    }

    // =========================================================
    // XR SNAPSHOT
    // =========================================================
    async function snapshotToXrScreen() {
      try {
        await document.fonts.ready;
        const rendered = await html2canvas(screenScroll, {
          backgroundColor: '#0b0b0d',
          scale: 1.5,
          logging: false,
          width: screenScroll.scrollWidth,
          height: screenScroll.scrollHeight,
        });
        const ctx = xrScreenCanvas.getContext('2d');
        ctx.fillStyle = '#0b0b0d';
        ctx.fillRect(0, 0, xrScreenCanvas.width, xrScreenCanvas.height);
        const scale = Math.min(
          xrScreenCanvas.width / rendered.width,
          xrScreenCanvas.height / rendered.height
        );
        const w = rendered.width * scale;
        const h = rendered.height * scale;
        const x = (xrScreenCanvas.width - w) / 2;
        ctx.drawImage(rendered, x, 0, w, h);
        xrScreenTexture.needsUpdate = true;
      } catch (err) {
        console.warn('XR snapshot failed', err);
      }
    }

    // =========================================================
    // XR SESSION MANAGEMENT
    // =========================================================
    let xrSession = null;
    let usesDeviceOrientation = false;

    function isInXR() {
      return webglRenderer.xr.isPresenting || usesDeviceOrientation;
    }

    async function startXRSession() {
      const button = document.getElementById('ar-button');
      button.disabled = true;

      // --- 1. Try immersive-ar (Android / WebXR) ---
      if (navigator.xr) {
        try {
          const supported = await navigator.xr.isSessionSupported('immersive-ar');
          if (supported) {
            // Request the session. 'local' gives us the phone's
            // position and rotation in a local reference space.
            // 'hit-test' is optional but useful if we later want
            // to place objects on the floor.
            xrSession = await navigator.xr.requestSession('immersive-ar', {
              requiredFeatures: ['local'],
              optionalFeatures: ['hit-test', 'dom-overlay'],
              domOverlay: { root: document.body },
            });
            await webglRenderer.xr.setSession(xrSession);
            // The sessionstart event listener will handle the UI switch.
            return;
          }
        } catch (err) {
          console.warn('immersive-ar failed, falling back to deviceorientation', err);
        }
      }

      // --- 2. Fallback: deviceorientation (iOS / no WebXR) ---
      if (window.DeviceOrientationEvent) {
        // iOS 13+ requires permission for device orientation
        if (typeof DeviceOrientationEvent.requestPermission === 'function') {
          try {
            const permission = await DeviceOrientationEvent.requestPermission();
            if (permission !== 'granted') {
              alert('Motion permission was denied. The cinema will stay in flat mode.');
              button.disabled = false;
              return;
            }
          } catch (err) {
            console.warn('DeviceOrientation permission request failed', err);
            button.disabled = false;
            return;
          }
        }
        enableDeviceOrientationFallback();
        button.textContent = 'Exit Cinema';
        button.disabled = false;
      } else {
        alert('This device does not support motion tracking.');
        button.disabled = false;
      }
    }

    function enableDeviceOrientationFallback() {
      usesDeviceOrientation = true;
      document.body.classList.add('vr-mode'); // reuse the same CSS class to hide flat UI
      xrScreenMesh.visible = true;
      snapshotToXrScreen();
      window.addEventListener('deviceorientation', onDeviceOrientation);
    }

    function disableDeviceOrientationFallback() {
      usesDeviceOrientation = false;
      document.body.classList.remove('vr-mode');
      xrScreenMesh.visible = false;
      window.removeEventListener('deviceorientation', onDeviceOrientation);
    }

    function onDeviceOrientation(event) {
      if (!usesDeviceOrientation) return;
      // alpha: z-axis (compass), beta: x-axis (front/back tilt), gamma: y-axis (left/right tilt)
      const alpha = THREE.MathUtils.degToRad(event.alpha || 0);
      const beta  = THREE.MathUtils.degToRad(event.beta  || 0);
      const gamma = THREE.MathUtils.degToRad(event.gamma || 0);

      // Map device orientation to camera yaw/pitch.
      // This is a simplified mapping; for a production app you would
      // use a quaternion-based approach with Euler order 'YXZ'.
      targetYaw   = THREE.MathUtils.clamp(alpha, -YAW_LIMIT, YAW_LIMIT);
      targetPitch = THREE.MathUtils.clamp(beta, -PITCH_LIMIT, PITCH_LIMIT);
    }

    // =========================================================
    // XR EVENT LISTENERS
    // =========================================================
    webglRenderer.xr.addEventListener('sessionstart', async () => {
      document.body.classList.add('vr-mode');
      xrScreenMesh.visible = true;
      // In AR, the phone's camera feed replaces the background.
      // We hide the panorama sphere and let the real world show through.
      pano.visible = false;
      await snapshotToXrScreen();
      startRenderLoop();
      const button = document.getElementById('ar-button');
      button.textContent = 'Exit Cinema';
      button.disabled = false;
    });

    webglRenderer.xr.addEventListener('sessionend', () => {
      document.body.classList.remove('vr-mode');
      xrScreenMesh.visible = false;
      pano.visible = true;
      xrSession = null;
      startRenderLoop();
      const button = document.getElementById('ar-button');
      button.textContent = 'Step Into Cinema';
      button.disabled = false;
    });

    // Button click handler
    document.getElementById('ar-button').addEventListener('click', () => {
      if (isInXR()) {
        if (xrSession) {
          xrSession.end();
        } else if (usesDeviceOrientation) {
          disableDeviceOrientationFallback();
          document.getElementById('ar-button').textContent = 'Step Into Cinema';
        }
      } else {
        startXRSession();
      }
    });

    // =========================================================
    // RENDER LOOP
    // =========================================================
    function flatAnimate() {
      if (isInXR()) return;
      yaw   += (targetYaw   - yaw)   * 0.08;
      pitch += (targetPitch - pitch) * 0.08;
      camera.rotation.set(pitch, yaw, 0, 'YXZ');
      webglRenderer.render(scene, camera);
      css3dRenderer.render(scene, camera);
    }

    function startRenderLoop() {
      webglRenderer.setAnimationLoop(null);

      if (webglRenderer.xr.isPresenting) {
        // XR mode: the XR session drives the camera.
        // Three.js's setAnimationLoop is required for XR.
        webglRenderer.setAnimationLoop(() => {
          webglRenderer.render(scene, camera);
        });
      } else if (usesDeviceOrientation) {
        // Device orientation fallback: we still use RAF,
        // but the camera is driven by targetYaw/targetPitch.
        const tick = () => {
          if (!usesDeviceOrientation) return;
          yaw   += (targetYaw   - yaw)   * 0.08;
          pitch += (targetPitch - pitch) * 0.08;
          camera.rotation.set(pitch, yaw, 0, 'YXZ');
          webglRenderer.render(scene, camera);
          requestAnimationFrame(tick);
        };
        requestAnimationFrame(tick);
      } else {
        // Flat mode
        const tick = () => {
          if (isInXR()) return;
          flatAnimate();
          requestAnimationFrame(tick);
        };
        requestAnimationFrame(tick);
      }
    }

    // =========================================================
    // RESIZE
    // =========================================================
    let resizeTimer;
    function onResize() {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(updateLayout, 60);
    }
    window.addEventListener('resize', onResize);
    window.addEventListener('orientationchange', onResize);

    // =========================================================
    // BOOT
    // =========================================================
    updateLayout();
    selectCartridge('rendering');
    startRenderLoop();

    const loading = document.getElementById('loading');
    requestAnimationFrame(() => {
      loading.style.opacity = '0';
      setTimeout(() => loading.remove(), 650);
    });
  </script>
</body>
</html>
